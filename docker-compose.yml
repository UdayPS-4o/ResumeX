services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: resumex-api
    environment:
      - PORT=8000
      - COMPILE_MODE=auto
    volumes:
      - resumex_data:/app/backend/data
    networks:
      - internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1500m

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: resumex-web
    environment:
      # Plain "api" collides with any other project on the shared
      # dokploy-network that also names a service "api" (Compose registers
      # the bare service name as a DNS alias network-wide) — use the
      # unique container_name instead.
      - BACKEND_URL=http://resumex-api:8000
    depends_on:
      - api
    networks:
      - internal
      - dokploy-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 500m

volumes:
  resumex_data:

networks:
  internal:
    driver: bridge
  dokploy-network:
    external: true
