# Local full-stack run: `docker compose -f docker/docker-compose.yml up --build`
services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      - PORT=8000
      - COMPILE_MODE=auto
    ports:
      - "8000:8000"

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    depends_on:
      - api
    ports:
      - "5173:80"
